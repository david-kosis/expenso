<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" width="100%" height="100%">
  <defs>
    <!-- Neon glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Liquid flow gradient -->
    <linearGradient id="liquidFlow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#800000" />
      <stop offset="50%" stop-color="#E31B23" />
      <stop offset="100%" stop-color="#FF4D4D" />
    </linearGradient>
  </defs>

  <!-- Infinity / Financial Flow Icon -->
  <g transform="translate(10, 0)">
    
    <!-- Base track -->
    <path
      d="M 40,90
         C 10,50 60,10 90,50
         C 120,90 140,90 170,50
         C 200,10 250,50 220,90
         C 190,130 170,130 140,90
         C 110,50 90,50 60,90
         Z"
      fill="none"
      stroke="#22252A"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glowing internal flow -->
    <path
      d="M 40,90
         C 10,50 60,10 90,50
         C 120,90 140,90 170,50
         C 200,10 250,50 220,90"
      fill="none"
      stroke="url(#liquidFlow)"
      stroke-width="10"
      stroke-linecap="round"
      filter="url(#neonGlow)"
    />

    <!-- Central indicator -->
    <circle
      cx="140"
      cy="90"
      r="12"
      fill="#E31B23"
      filter="url(#neonGlow)"
    />

  </g>
</svg>